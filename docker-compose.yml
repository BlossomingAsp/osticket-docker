services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-osticket}
      MARIADB_USER: ${MARIADB_USER:-osticket}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set in .env}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  osticket:
    build:
      context: .
      args:
        OSTICKET_VERSION: ${OSTICKET_VERSION:-1.18.4}
        OSTICKET_LANG: ${OSTICKET_LANG:-en_US}
    image: osticket-docker-osticket
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      OSTICKET_TRUSTED_PROXIES: ${OSTICKET_TRUSTED_PROXIES:-}
      OSTICKET_AUTOINSTALL: ${OSTICKET_AUTOINSTALL:-0}
      OSTICKET_HELPDESK_NAME: ${OSTICKET_HELPDESK_NAME:-}
      OSTICKET_DEFAULT_EMAIL: ${OSTICKET_DEFAULT_EMAIL:-}
      OSTICKET_LANG: ${OSTICKET_LANG:-en_US}
      OSTICKET_TIMEZONE: ${OSTICKET_TIMEZONE:-UTC}
      OSTICKET_HELPDESK_URL: ${OSTICKET_HELPDESK_URL:-}
      OSTICKET_ADMIN_FNAME: ${OSTICKET_ADMIN_FNAME:-Admin}
      OSTICKET_ADMIN_LNAME: ${OSTICKET_ADMIN_LNAME:-User}
      OSTICKET_ADMIN_EMAIL: ${OSTICKET_ADMIN_EMAIL:-}
      OSTICKET_ADMIN_USERNAME: ${OSTICKET_ADMIN_USERNAME:-}
      OSTICKET_ADMIN_PASSWORD: ${OSTICKET_ADMIN_PASSWORD:-}
      OSTICKET_PLUGINS: ${OSTICKET_PLUGINS:-}
      OSTICKET_OIDC_NAME: ${OSTICKET_OIDC_NAME:-}
      OSTICKET_OIDC_URL: ${OSTICKET_OIDC_URL:-}
      OSTICKET_OIDC_CLIENT_ID: ${OSTICKET_OIDC_CLIENT_ID:-}
      OSTICKET_OIDC_CLIENT_SECRET: ${OSTICKET_OIDC_CLIENT_SECRET:-}
      OSTICKET_OIDC_AUTH_TARGET: ${OSTICKET_OIDC_AUTH_TARGET:-agents}
      OSTICKET_OIDC_ATTR_USERNAME: ${OSTICKET_OIDC_ATTR_USERNAME:-preferred_username}
      OSTICKET_GOOGLE_NAME: ${OSTICKET_GOOGLE_NAME:-Google}
      OSTICKET_GOOGLE_CLIENT_ID: ${OSTICKET_GOOGLE_CLIENT_ID:-}
      OSTICKET_GOOGLE_CLIENT_SECRET: ${OSTICKET_GOOGLE_CLIENT_SECRET:-}
      OSTICKET_GOOGLE_AUTH_TARGET: ${OSTICKET_GOOGLE_AUTH_TARGET:-agents}
      OSTICKET_DISCORD_NAME: ${OSTICKET_DISCORD_NAME:-Discord}
      OSTICKET_DISCORD_CLIENT_ID: ${OSTICKET_DISCORD_CLIENT_ID:-}
      OSTICKET_DISCORD_CLIENT_SECRET: ${OSTICKET_DISCORD_CLIENT_SECRET:-}
      OSTICKET_DISCORD_AUTH_TARGET: ${OSTICKET_DISCORD_AUTH_TARGET:-agents}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-osticket}
      MARIADB_USER: ${MARIADB_USER:-osticket}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set in .env}
    ports:
      - "${OSTICKET_HTTP_PORT:-8080}:80"
    volumes:
      - osticket_data:/var/www/html/include
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  discord-bot:
    build:
      context: ./docker/discord-bot
      dockerfile: Dockerfile
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      osticket:
        condition: service_healthy
    environment:
      DISCORD_BOT_TOKEN: ${OSTICKET_DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${OSTICKET_DISCORD_CHANNEL_ID:-0}
      DISCORD_TICKET_COMMAND: ${OSTICKET_DISCORD_TICKET_COMMAND:-!ticket}
      OSTICKET_API_KEY: ${OSTICKET_DISCORD_API_KEY:-}
      OSTICKET_BASE_URL: http://osticket:80
      OSTICKET_TOPIC_ID: ${OSTICKET_TOPIC_ID:-1}
      CHANNEL_FIELD: ${OSTICKET_DISCORD_CHANNEL_FIELD:-}
      POLL_INTERVAL: ${OSTICKET_DISCORD_POLL_INTERVAL:-30}
      STATUS_EMOJIS: ${OSTICKET_DISCORD_STATUS_EMOJIS:-}
      FALLBACK_EMOJI: ${OSTICKET_DISCORD_FALLBACK_EMOJI:-📥}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MARIADB_DATABASE:-osticket}
      DB_USER: ${MARIADB_USER:-osticket}
      DB_PASSWORD: ${MARIADB_PASSWORD:?set in .env}

volumes:
  db_data:
  osticket_data:
