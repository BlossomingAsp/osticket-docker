services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    container_name: osticket-db
    # Optional resource limits (recommended for production). Only enable on a
    # host with enough RAM/CPU -- limits above what the host has will stop the
    # container from starting. See README -> "Resource limits".
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2g
    #       cpus: "2.0"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-osticket}
      MARIADB_USER: ${MARIADB_USER:-osticket}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set in .env}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb", "-h", "localhost", "-u", "root", "-p${MARIADB_ROOT_PASSWORD}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  osticket:
    build:
      context: .
      args:
        OSTICKET_VERSION: ${OSTICKET_VERSION:-1.18.4}
        OSTICKET_LANG: ${OSTICKET_LANG:-en_US}
    image: osticket-docker-osticket
    restart: unless-stopped
    container_name: osticket
    # Optional resource limits (recommended for production).
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1g
    #       cpus: "2.0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      OSTICKET_TRUSTED_PROXIES: ${OSTICKET_TRUSTED_PROXIES:-}
      OSTICKET_AUTOINSTALL: ${OSTICKET_AUTOINSTALL:-0}
      OSTICKET_HELPDESK_NAME: ${OSTICKET_HELPDESK_NAME:-}
      OSTICKET_DEFAULT_EMAIL: ${OSTICKET_DEFAULT_EMAIL:-}
      OSTICKET_LANG: ${OSTICKET_LANG:-en_US}
      OSTICKET_TIMEZONE: ${OSTICKET_TIMEZONE:-UTC}
      OSTICKET_HELPDESK_URL: ${OSTICKET_HELPDESK_URL:-}
      OSTICKET_ADMIN_FNAME: ${OSTICKET_ADMIN_FNAME:-Admin}
      OSTICKET_ADMIN_LNAME: ${OSTICKET_ADMIN_LNAME:-User}
      OSTICKET_ADMIN_EMAIL: ${OSTICKET_ADMIN_EMAIL:-}
      OSTICKET_ADMIN_USERNAME: ${OSTICKET_ADMIN_USERNAME:-}
      OSTICKET_ADMIN_PASSWORD: ${OSTICKET_ADMIN_PASSWORD:-}
      OSTICKET_PLUGINS: ${OSTICKET_PLUGINS:-}
      OSTICKET_OIDC_NAME: ${OSTICKET_OIDC_NAME:-}
      OSTICKET_OIDC_URL: ${OSTICKET_OIDC_URL:-}
      OSTICKET_OIDC_CLIENT_ID: ${OSTICKET_OIDC_CLIENT_ID:-}
      OSTICKET_OIDC_CLIENT_SECRET: ${OSTICKET_OIDC_CLIENT_SECRET:-}
      OSTICKET_OIDC_AUTH_TARGET: ${OSTICKET_OIDC_AUTH_TARGET:-agents}
      OSTICKET_OIDC_ATTR_USERNAME: ${OSTICKET_OIDC_ATTR_USERNAME:-preferred_username}
      OSTICKET_GOOGLE_NAME: ${OSTICKET_GOOGLE_NAME:-Google}
      OSTICKET_GOOGLE_CLIENT_ID: ${OSTICKET_GOOGLE_CLIENT_ID:-}
      OSTICKET_GOOGLE_CLIENT_SECRET: ${OSTICKET_GOOGLE_CLIENT_SECRET:-}
      OSTICKET_GOOGLE_AUTH_TARGET: ${OSTICKET_GOOGLE_AUTH_TARGET:-agents}
      OSTICKET_DISCORD_NAME: ${OSTICKET_DISCORD_NAME:-Discord}
      OSTICKET_DISCORD_CLIENT_ID: ${OSTICKET_DISCORD_CLIENT_ID:-}
      OSTICKET_DISCORD_CLIENT_SECRET: ${OSTICKET_DISCORD_CLIENT_SECRET:-}
      OSTICKET_DISCORD_AUTH_TARGET: ${OSTICKET_DISCORD_AUTH_TARGET:-agents}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-osticket}
      MARIADB_USER: ${MARIADB_USER:-osticket}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set in .env}
    ports:
      - "${OSTICKET_HTTP_PORT:-8080}:80"
    volumes:
      - osticket_data:/var/www/html/include
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  discord-bot:
    build:
      context: ./docker/discord-bot
      dockerfile: Dockerfile
    restart: on-failure
    container_name: osticket-discord
    # Optional resource limits (recommended for production).
    # deploy:
    #   resources:
    #     limits:
    #       memory: 256m
    #       cpus: "0.5"
    depends_on:
      db:
        condition: service_healthy
      osticket:
        condition: service_healthy
    # Static IP: osTicket API keys are bound to an exact client IP (the lookup
    # is `WHERE apikey=? AND ipaddr=<REMOTE_ADDR>`), so the bot must have a
    # stable address to create the API key against. This is 172.30.0.10.
    networks:
      default:
        ipv4_address: 172.30.0.10
    environment:
      DISCORD_BOT_TOKEN: ${OSTICKET_DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${OSTICKET_DISCORD_CHANNEL_ID:-0}
      DISCORD_TICKET_COMMAND: ${OSTICKET_DISCORD_TICKET_COMMAND:-!ticket}
      OSTICKET_API_KEY: ${OSTICKET_DISCORD_API_KEY:-}
      OSTICKET_BASE_URL: http://osticket:80
      OSTICKET_TOPIC_ID: ${OSTICKET_TOPIC_ID:-1}
      CHANNEL_FIELD: ${OSTICKET_DISCORD_CHANNEL_FIELD:-}
      POLL_INTERVAL: ${OSTICKET_DISCORD_POLL_INTERVAL:-30}
      RATE_LIMIT: ${OSTICKET_DISCORD_RATE_LIMIT:-300}
      STATUS_EMOJIS: ${OSTICKET_DISCORD_STATUS_EMOJIS:-}
      FALLBACK_EMOJI: ${OSTICKET_DISCORD_FALLBACK_EMOJI:-📥}
      DISCORD_THREAD_ENABLED: ${OSTICKET_DISCORD_THREAD_ENABLED:-1}
      DISCORD_THREAD_PREFIX: ${OSTICKET_DISCORD_THREAD_PREFIX:-ticket-}
      DISCORD_STAFF_MAP: ${OSTICKET_DISCORD_STAFF_MAP:-}
      DISCORD_STAFF_MATCH: ${OSTICKET_DISCORD_STAFF_MATCH:-0}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MARIADB_DATABASE:-osticket}
      DB_USER: ${MARIADB_USER:-osticket}
      DB_PASSWORD: ${MARIADB_PASSWORD:?set in .env}

  mail:
    # Optional self-hosted mail server (Stalwart): SMTP + IMAP/JMAP + built-in
    # anti-spam and DKIM/SPF/DMARC, Let's Encrypt via ACME, all in one container.
    # Enabled with OSTICKET_MAIL_ENABLED=1 + OSTICKET_MAIL_HOSTNAME in .env; the
    # profile keeps it out of the default stack (bring it up with
    # `./install.sh`, `./update.sh`, or `docker compose --profile mail up -d`).
    #
    # IPv4-only egress: the default compose network is a single IPv4 /24, so this
    # container has no IPv6 address and all SMTP delivery is IPv4. That is
    # deliberate -- it avoids ever needing an IPv6 PTR (providers like Contabo
    # only let you set a single IPv4 one). A matching IPv4 PTR (mail.<domain>)
    # and open outbound/inbound port 25 are still required for delivery.
    image: ${OSTICKET_MAIL_IMAGE:-stalwartlabs/stalwart:v0.16}
    restart: unless-stopped
    container_name: osticket-mail
    profiles: ["mail"]
    networks:
      - default
    ports:
      - "${OSTICKET_MAIL_SMTP_PORT:-25}:25"
      - "${OSTICKET_MAIL_SUBMISSION_PORT:-587}:587"
      - "${OSTICKET_MAIL_SMTPS_PORT:-465}:465"
      - "${OSTICKET_MAIL_IMAPS_PORT:-993}:993"
      - "${OSTICKET_MAIL_TLS_PORT:-443}:443"      # management UI (HTTPS) + ACME tls-alpn-01
      - "${OSTICKET_MAIL_WEB_PORT:-8081}:8080"    # management UI (HTTP), avoids osticket's 8080
      # Optional extra ports (uncomment if needed):
      # - "${OSTICKET_MAIL_IMAP_PORT:-143}:143"   # IMAP STARTTLS; IMAPS 993 usually suffices
      # - "${OSTICKET_MAIL_POP_PORT:-110}:110"
      # - "${OSTICKET_MAIL_POPS_PORT:-995}:995"
      # - "${OSTICKET_MAIL_SIEVE_PORT:-4190}:4190"
    volumes:
      - stalwart_etc:/etc/stalwart
      - stalwart_data:/var/lib/stalwart
    environment:
      STALWART_HOSTNAME: ${OSTICKET_MAIL_HOSTNAME:-}
      STALWART_PUBLIC_URL: ${OSTICKET_MAIL_PUBLIC_URL:-}

  cron:
    # Reproducible osTicket scheduler: polls api/cron.php so osTicket actually
    # delivers queued mail and fetches inbound IMAP replies. Defined in compose
    # (no host crontab to reproduce elsewhere) and tied to the mail profile.
    image: alpine:3.19
    restart: unless-stopped
    container_name: osticket-cron
    profiles: ["mail"]
    depends_on:
      osticket:
        condition: service_healthy
    networks:
      - default
    command: >
      sh -c 'while true; do
        wget -q -O /dev/null http://osticket/api/cron.php || true;
        sleep 120;
      done'

volumes:
  db_data:
  osticket_data:
  stalwart_etc:
  stalwart_data:

networks:
  default:
    # Explicit subnet so the discord-bot service can hold a stable IP
    # (172.30.0.10) for its osTicket API key.
    ipam:
      config:
        - subnet: 172.30.0.0/24
