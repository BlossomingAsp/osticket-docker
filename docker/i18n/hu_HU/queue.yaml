# Override for the defective queue.yaml in the official hu_HU language pack
# (downloads.osticket.com/lang/1.18.x/hu.phar). The upstream pack sets the
# root queues' parent_id to their own id (id 1 -> parent 1) and to 1 for the
# My Tickets (5) and Closed (15) roots. CustomQueue::getHierarchicalQueues()
# then recurses forever on the self-referential root and /scp/ dies with a
# memory-exhaustion 500. osTicket's DataTemplate prefers a directory override
# (include/i18n/hu_HU/) over the phar, so this file replaces just queue.yaml
# at install time. The only change vs. the upstream pack is parent_id 0 for
# queues 1, 5 and 15.
-
  #Basic queues for the initial ticket system. Queues installed for
  #- Open / All
  #- Open / Unassigned
  #- Open / Overdue
  #- Answered / All
  #- My Tickets / All
  #- Closed / All
  #Fields:
  #id:
  #parent_id:
  #flags:
  #0x01:   FLAG_PUBLIC
  #0x02:   FLAG_QUEUE (should be set for everything here)
  #0x04:   FLAG_DISABLED
  #0x08:   FLAG_INHERIT (inherit criteria from parent)
  #0x10:   FLAG_INHERIT_COLUMNS
  #0x20:   FLAG_INHERIT_SORTING
  #staff_id: User owner of the queue
  #sort:     Manual sort order
  #title:    Display name of the queue
  #config:   Criteria configuration
  #filter:   Quick filter field
  #root:     Object type of the queue listing
  #'T':    Tickets
  #'A':    Tasks
---
  id: 1
  title: Megnyit
  parent_id: 0
  flags: 0x03
  sort: 1
  sort_id: 1
  root: T
  config: '[["status__state","includes",{"open":"Open"}]]'
