; PHP OPcache tuning for osTicket. Copied into the image at build time
; (see Dockerfile). PHP is a long-running process here, so the file-based
; cache is a clear win -- osTicket is not a per-request build. The base
; php image already loads the extension (docker-php-ext-opcache.ini), so
; only tuning directives are set here.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
; PHP hardening: don't leak the interpreter version in responses.
expose_php=Off
